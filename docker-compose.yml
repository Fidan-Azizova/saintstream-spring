services:
  mysql:
    image: mysql:8.0
    container_name: saintstream-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: saintstream
      MYSQL_USER: saintstream
      MYSQL_PASSWORD: saintstream
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - saintstream-data:/var/lib/mysql

volumes:
  saintstream-data:
