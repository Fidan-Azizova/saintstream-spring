spring.application.name=saintstream-api

# .env faylını oxuyur (fayl yoxdursa, əməliyyat sistemi mühit dəyişənləri işlənir)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:5000}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD:}

# Bağlantı uğursuzdursa tez bildirsin; yoxlamanı DbConnectionCheck özü aydın mesajla edir
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Baza avtomatik doldurulmur. Doldurmaq üçün: init profili (README-yə bax)
spring.sql.init.mode=never

# Xəta cavablarında stack trace göstərilmir
server.error.include-stacktrace=never
