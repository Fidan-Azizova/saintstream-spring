# Yalnız "init" profili ilə işləyir: sql/schema.sql və sql/data.sql bazada icra olunur.
# DİQQƏT: schema.sql cədvəlləri silib yenidən yaradır (yalnız development üçün!).
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./sql/schema.sql
spring.sql.init.data-locations=file:./sql/data.sql
spring.sql.init.encoding=UTF-8
